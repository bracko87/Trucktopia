# netlify.toml
# Netlify configuration: keep function headers and only the minimal safe redirects.
# SPA wildcard rewrites will be served from /public/_redirects (recommended).
# This file intentionally contains only explicit known-route rewrites (safe list).

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://sider.ai"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization, apikey, Prefer, Origin"
    Access-Control-Max-Age = "86400"
    Vary = "Origin"
    Access-Control-Allow-Credentials = "true"

# Safe explicit SPA rewrites (only known app routes).
[[redirects]]
  from = "/market"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/company"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/jobs"
  to = "/index.html"
  status = 200
