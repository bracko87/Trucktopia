# netlify.toml
# This file configures Netlify headers for function requests and SPA route rewrites.
# Purpose:
# - Ensure OPTIONS preflight and all function responses include Access-Control-Allow-* headers.
# - Rewrite known single-page-app routes to /index.html so client-side routing works on refresh/deep links.
# Place this file in the repository root (next to package.json) and trigger a redeploy.

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://sider.ai"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization, apikey, Prefer, Origin"
    Access-Control-Max-Age = "86400"
    Vary = "Origin"
    Access-Control-Allow-Credentials = "true"

# SPA rewrites: only rewrite known app routes to index.html so the client router can handle them.
# Add more entries here when new top-level routes are introduced in the app.

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

